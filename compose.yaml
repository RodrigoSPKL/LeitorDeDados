x-common: &common
  image: leitor-dados:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  api:
    <<: *common
    user: "10001:10001"
    init: true
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      API_KEY_FILE: /run/secrets/api_key
      CURSOR_SECRET_FILE: /run/secrets/cursor_secret
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
    secrets:
      - api_key
      - cursor_secret
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/ready',headers={'X-API-Key':Path('/run/secrets/api_key').read_text().strip()}); urllib.request.urlopen(r,timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  tools:
    <<: *common
    profiles:
      - tools
    user: "0:0"
    init: true
    entrypoint:
      - python
      - -m
      - leitor_dados
    command:
      - --help
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DATA_PATH:-./data}:/data:rw
      - ./inputs:/inputs:ro
      - ./examples:/examples:ro
      - ./config:/config:ro
      - ./secrets:/secrets:rw
      - ./.leitor:/work:rw

secrets:
  api_key:
    file: ./secrets/api_key
  cursor_secret:
    file: ./secrets/cursor_secret
